steps:
  # Etapa 1: Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/pnad-app:latest
      - -f
      - dockerfile
      - .

  # Etapa 2: Push da imagem para o Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - gcr.io/$PROJECT_ID/pnad-app:latest

  # Etapa 3: Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - pnad-app
      - --image
      - gcr.io/$PROJECT_ID/pnad-app:latest
      - --region
      - southamerica-east1
      - --platform
      - managed
      - --allow-unauthenticated

# Conta de serviço usada pelo build
serviceAccount: cloudbuild-deploy@pnad-salarios.iam.gserviceaccount.com

# Configuração de logs
logsBucket: gs://1043829155645-southamerica-east1-cloudbuild-logs

options:
  logging: LEGACY

  
